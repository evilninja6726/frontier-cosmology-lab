name: Project Frontier Cloud Research Pipeline

on:
  workflow_dispatch:
    inputs:
      run_milestone7:
        description: "Run Milestone 7 Baseline Reproduction (BM-01)"
        required: false
        default: "true"
      run_milestone8:
        description: "Run Milestone 8 Research Extensions (EXP-01 to EXP-03)"
        required: false
        default: "true"
  push:
    branches: [ main, master ]

jobs:
  cosmology-cloud-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout frontier-cosmology-lab
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Scientific Python Stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sympy jax jaxlib camb cobaya astropy getdist matplotlib pytest

      - name: Execute Symbolic Derivations (SymPy)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/03-projects/pr01-horndeski-crossing-identifiability
        run: |
          python 03-projects/pr01-horndeski-crossing-identifiability/derivations/flrw_and_horndeski_symbolic.py

      - name: Execute Milestone 7 Benchmark (BM-01)
        if: ${{ github.event.inputs.run_milestone7 != 'false' }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/03-projects/pr01-horndeski-crossing-identifiability
          OMP_NUM_THREADS: "4"
        run: |
          python 03-projects/pr01-horndeski-crossing-identifiability/reproduction/run_milestone7_benchmark.py

      - name: Execute Milestone 8 Experiments (EXP-01, EXP-02, EXP-03)
        if: ${{ github.event.inputs.run_milestone8 != 'false' }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/03-projects/pr01-horndeski-crossing-identifiability
          OMP_NUM_THREADS: "4"
        run: |
          python 03-projects/pr01-horndeski-crossing-identifiability/experiments/run_milestone8_experiments.py

      - name: Run Full Pytest Verification Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/03-projects/pr01-horndeski-crossing-identifiability
        run: |
          pytest infrastructure/tests/ -v

      - name: Upload Experiment Reports and Publication Figures
        uses: actions/upload-artifact@v4
        with:
          name: frontier-cosmology-results
          path: |
            05-experiments/experiment-registry/*.json
            03-projects/pr01-horndeski-crossing-identifiability/results/*.png

      - name: Commit Cloud Results Back to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-experiments/experiment-registry/*.json 03-projects/pr01-horndeski-crossing-identifiability/results/*.png
          git diff --staged --quiet || (git commit -m "chore(cloud): sync experiment reports and figures [skip ci]" && git push)
