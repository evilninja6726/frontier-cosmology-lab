[project]
name = "frontier-cosmology-lab"
version = "0.1.0"
description = "Autonomous AI-Assisted Cosmology & Fundamental Physics Research Laboratory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rajat & Frontier Research Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sympy>=1.13.0",
    "astropy>=6.1.0",
    "matplotlib>=3.9.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "camb>=1.5.8",
    "cobaya>=3.5.0",
    "getdist>=1.5.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["infrastructure/tests"]
python_files = "test_*.py"
